<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Battle — Admin Panel</title>
<style>
  :root{
    --neon-violet:#a855f7;
    --neon-cyan:#22d3ee;
    --bg-dark:#0a0a12;
    --bg-card:#12121e;
    --text-glow:0 0 10px rgba(168,85,247,.8);
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 20%, rgba(168,85,247,.25), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(34,211,238,.2), transparent 40%),
      var(--bg-dark);
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(168,85,247,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(168,85,247,.06) 1px, transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
    animation:gridMove 20s linear infinite;
  }
  @keyframes gridMove{
    0%{background-position:0 0;}
    100%{background-position:40px 40px;}
  }
  .card{
    position:relative;
    z-index:1;
    background:linear-gradient(160deg, rgba(18,18,30,.9), rgba(10,10,18,.9));
    border:1px solid rgba(168,85,247,.4);
    border-radius:20px;
    max-width:460px;
    width:100%;
    padding:36px 28px;
    text-align:center;
    box-shadow:0 0 40px rgba(168,85,247,.25), inset 0 0 30px rgba(34,211,238,.05);
    backdrop-filter:blur(10px);
  }
  .logo{
    width:90px;height:90px;
    margin:0 auto 18px;
    border-radius:20px;
    background:linear-gradient(135deg,var(--neon-violet),var(--neon-cyan));
    display:flex;align-items:center;justify-content:center;
    font-size:36px;font-weight:900;
    box-shadow:0 0 25px rgba(168,85,247,.7);
    animation:pulseLogo 2.5s ease-in-out infinite;
  }
  @keyframes pulseLogo{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.06);}
  }
  h1{
    font-size:28px;
    letter-spacing:1px;
    background:linear-gradient(90deg,var(--neon-violet),var(--neon-cyan));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:var(--text-glow);
    margin-bottom:6px;
  }
  .tag{
    color:#9ca3af;
    font-size:13px;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:22px;
  }
  .badges{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:24px;
  }
  .badge{
    font-size:12px;
    padding:6px 12px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.05);
    color:#d1d5db;
  }
  .badge b{color:var(--neon-cyan);}

  .download-btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:16px 20px;
    font-size:17px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#fff;
    background:linear-gradient(90deg,var(--neon-violet),var(--neon-cyan));
    border:none;
    border-radius:14px;
    cursor:pointer;
    overflow:hidden;
    box-shadow:0 0 25px rgba(168,85,247,.6);
    transition:transform .15s ease, box-shadow .3s ease;
    text-decoration:none;
  }
  .download-btn:hover{
    transform:translateY(-2px) scale(1.02);
    box-shadow:0 0 40px rgba(34,211,238,.8);
  }
  .download-btn:active{
    transform:translateY(0) scale(.98);
  }
  .download-btn::before{
    content:"";
    position:absolute;
    top:0;left:-75%;
    width:50%;height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.5), transparent);
    transform:skewX(-20deg);
    animation:shine 2.8s infinite;
  }
  @keyframes shine{
    0%{left:-75%;}
    50%{left:130%;}
    100%{left:130%;}
  }

  .status{
    margin-top:14px;
    font-size:13px;
    color:var(--neon-cyan);
    min-height:18px;
  }

  .info{
    margin-top:24px;
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#9ca3af;
    border-top:1px solid rgba(255,255,255,.08);
    padding-top:16px;
  }
  .info div b{
    display:block;
    color:#fff;
    font-size:14px;
  }

  footer{
    margin-top:20px;
    font-size:11px;
    color:#6b7280;
    text-align:center;
    z-index:1;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="logo">RB</div>
    <h1>ROYAL BATTLE</h1>
    <div class="tag">Admin Control Panel</div>

    <div class="badges">
      <span class="badge">Version <b>1.0</b></span>
      <span class="badge">Platform <b>Android</b></span>
      <span class="badge">Type <b>APK</b></span>
    </div>

    <a
      id="downloadBtn"
      class="download-btn"
      href="https://raw.githubusercontent.com/royalbattleoffical84-code/New-repository-/main/Royal%20Battle%20Admin%20panel.apk"
      download="RoyalBattle-AdminPanel.apk"
    >
      ⬇ Download Admin Panel
    </a>
    <div class="status" id="statusText"></div>

    <div class="info">
      <div><b>Secure</b>Direct Link</div>
      <div><b>No Ads</b>Clean Install</div>
      <div><b>Fast</b>GitHub CDN</div>
    </div>
  </div>

  <footer>Build by Shivam • Royal Battle Esports</footer>

  <script>
    const btn = document.getElementById('downloadBtn');
    const status = document.getElementById('statusText');
    btn.addEventListener('click', () => {
      status.textContent = "Download shuru ho raha hai...";
      setTimeout(() => {
        status.textContent = "Agar download shuru na ho, link ko naye tab me kholein.";
      }, 2500);
    });
  </script>

</body>
</html>
