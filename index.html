<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Epic Moder — App Store</title>
<meta name="description" content="Download apps in one tap.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0e1a;
  --bg-elev:#12162a;
  --bg-elev-2:#1a1f3a;
  --text:#edeffc;
  --text-dim:#8b90ac;
  --line:#232a4a;

  --coral:#ff6b6b;
  --teal:#3ddc97;
  --amber:#ffc857;
  --violet:#a78bfa;
  --pink:#ff6fb5;
  --sky:#5cc8ff;
}

*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
h1,h2,h3,.logo,.appname,.btn-download,.chip{
  font-family:'Baloo 2',sans-serif;
}
::-webkit-scrollbar{height:6px;width:6px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

/* ---------- background atmosphere ---------- */
.bg-glow{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(600px circle at 15% 10%, rgba(167,139,250,.16), transparent 60%),
    radial-gradient(500px circle at 85% 25%, rgba(92,200,255,.12), transparent 60%),
    radial-gradient(500px circle at 50% 90%, rgba(255,107,107,.10), transparent 60%);
}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:50;
  background:rgba(11,14,26,.85);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:16px 20px;
}
.header-row{display:flex; align-items:center; justify-content:space-between; max-width:1080px; margin:0 auto;}
.logo{font-size:1.4rem; font-weight:800; letter-spacing:.5px;
  background:linear-gradient(120deg,var(--violet),var(--sky));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.logo span{color:var(--text);}

/* ---------- hero ---------- */
.hero{
  position:relative; z-index:1;
  max-width:1080px; margin:0 auto; padding:44px 20px 20px;
  text-align:center;
}
.hero h1{
  font-size:2.1rem; font-weight:800; line-height:1.15; letter-spacing:.3px;
}
.hero h1 .accent{
  background:linear-gradient(120deg,var(--coral),var(--amber));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero p{color:var(--text-dim); margin-top:10px; font-size:.95rem;}

.search-wrap{
  max-width:520px; margin:26px auto 0;
  display:flex; align-items:center; gap:10px;
  background:var(--bg-elev);
  border:1px solid var(--line);
  border-radius:18px;
  padding:13px 18px;
}
.search-wrap svg{flex-shrink:0; opacity:.6;}
.search-wrap input{
  flex:1; background:none; border:none; outline:none;
  color:var(--text); font-family:'Inter',sans-serif; font-size:.95rem;
}
.search-wrap input::placeholder{color:var(--text-dim);}

/* ---------- category chips ---------- */
.chips{
  max-width:1080px; margin:26px auto 0; padding:0 20px;
  display:flex; gap:10px; overflow-x:auto; -ms-overflow-style:none; scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0; padding:9px 18px; border-radius:14px; font-size:.85rem; font-weight:600;
  background:var(--bg-elev); border:1px solid var(--line); color:var(--text-dim);
  cursor:pointer; transition:.2s ease; white-space:nowrap;
}
.chip.active{
  background:linear-gradient(120deg,var(--violet),var(--sky));
  color:#0b0e1a; border-color:transparent;
}

/* ---------- grid ---------- */
.grid{
  position:relative; z-index:1;
  max-width:1080px; margin:0 auto; padding:28px 20px 60px;
  display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:16px;
}

.card{
  position:relative;
  background:var(--bg-elev);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px 14px 16px;
  display:flex; flex-direction:column; align-items:center; text-align:center;
  transition:transform .25s ease, border-color .25s ease;
}
.card:hover{ transform:translateY(-4px); border-color:var(--card-accent, var(--violet)); }

.icon-wrap{
  position:relative; width:64px; height:64px; margin-bottom:12px;
}
.icon-glow{
  position:absolute; inset:-10px; border-radius:24px;
  background:var(--card-accent, var(--violet));
  filter:blur(16px); opacity:.35;
}
.icon-img{
  position:relative; width:64px; height:64px; border-radius:18px; object-fit:cover;
  border:1px solid rgba(255,255,255,.08);
}

.appname{font-size:.95rem; font-weight:700; line-height:1.2;}
.meta-row{display:flex; align-items:center; gap:6px; margin-top:5px; color:var(--text-dim); font-size:.72rem;}
.meta-row .dot{width:3px; height:3px; border-radius:50%; background:var(--text-dim);}
.rating{color:var(--amber); display:flex; align-items:center; gap:2px;}

.btn-download{
  margin-top:14px; width:100%; padding:9px 0; border-radius:12px; border:none;
  font-size:.82rem; font-weight:700; letter-spacing:.3px; cursor:pointer;
  background:var(--card-accent, var(--violet)); color:#0b0e1a;
  display:flex; align-items:center; justify-content:center; gap:6px;
  transition:filter .15s ease;
}
.btn-download:active{filter:brightness(.9);}
.btn-download.done{
  background:var(--bg-elev-2); color:var(--teal); border:1px solid var(--teal);
}

.empty-state{
  grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--text-dim);
}
.empty-state h3{color:var(--text); font-size:1.1rem; margin-bottom:6px;}

footer{
  text-align:center; padding:24px 20px 40px; color:var(--text-dim); font-size:.78rem;
  line-height:1.8;
}
footer .credit{
  display:block; margin-top:2px; font-family:'Baloo 2',sans-serif; font-weight:700;
  font-size:.85rem;
  background:linear-gradient(120deg,var(--amber),var(--coral));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
</style>
</head>
<body>

<div class="bg-glow"></div>

<header>
  <div class="header-row">
    <div class="logo">Epic Moder<span>.</span></div>
  </div>
</header>

<section class="hero">
  <h1>Apps, one tap<br><span class="accent">to your phone.</span></h1>
  <p>No sign-in. No store queue. Just pick and download.</p>

  <div class="search-wrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Search apps...">
  </div>
</section>

<div class="chips" id="chipsRow"></div>

<main class="grid" id="appGrid"></main>

<footer>
  Epic Moder — direct APK downloads.
  <span class="credit">Build by SHIVAM KASHYAP 👑</span>
</footer>

<script>
const ACCENTS = ['#a78bfa','#3ddc97','#ff6fb5','#5cc8ff','#ffc857','#ff6b6b'];
const CATEGORY_COLOR = {
  'Games':'#a78bfa', 'Tools':'#3ddc97', 'Photo':'#ff6fb5',
  'Social':'#5cc8ff', 'Productivity':'#ffc857', 'Entertainment':'#ff6b6b'
};

let allApps = [];
let activeCategory = 'All';

function colorFor(app, i){
  return CATEGORY_COLOR[app.category] || ACCENTS[i % ACCENTS.length];
}

function renderChips(){
  const cats = ['All', ...new Set(allApps.map(a => a.category).filter(Boolean))];
  const row = document.getElementById('chipsRow');
  row.innerHTML = cats.map(c =>
    `<div class="chip ${c===activeCategory?'active':''}" data-cat="${c}">${c}</div>`
  ).join('');
  row.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', () => {
      activeCategory = el.dataset.cat;
      renderChips();
      renderGrid();
    });
  });
}

function renderGrid(){
  const grid = document.getElementById('appGrid');
  const term = document.getElementById('searchInput').value.trim().toLowerCase();

  const filtered = allApps.filter(a => {
    const matchesCat = activeCategory === 'All' || a.category === activeCategory;
    const matchesTerm = !term || a.name.toLowerCase().includes(term);
    return matchesCat && matchesTerm;
  });

  if(filtered.length === 0){
    grid.innerHTML = `<div class="empty-state"><h3>No apps found</h3><p>Try a different search or category.</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map((app, i) => {
    const accent = colorFor(app, i);
    return `
      <div class="card" style="--card-accent:${accent}">
        <div class="icon-wrap">
          <div class="icon-glow"></div>
          <img class="icon-img" src="${app.icon}" alt="${app.name}" loading="lazy">
        </div>
        <div class="appname">${app.name}</div>
        <div class="meta-row">
          <span class="rating">★ ${app.rating || '—'}</span>
          <span class="dot"></span>
          <span>${app.size || ''}</span>
        </div>
        <button class="btn-download" data-apk="${app.apk}" data-name="${app.name}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
          Install
        </button>
      </div>
    `;
  }).join('');

  grid.querySelectorAll('.btn-download').forEach(btn => {
    btn.addEventListener('click', () => {
      const apkUrl = btn.dataset.apk;
      const name = btn.dataset.name;
      window.location.href = apkUrl;

      btn.classList.add('done');
      btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg> Downloading`;

      // bump a purely local, on-device counter — not shared analytics
      const key = 'vault_downloads';
      const counts = JSON.parse(localStorage.getItem(key) || '{}');
      counts[name] = (counts[name] || 0) + 1;
      localStorage.setItem(key, JSON.stringify(counts));
    });
  });
}

document.getElementById('searchInput').addEventListener('input', renderGrid);

fetch('apps.json')
  .then(r => r.json())
  .then(data => {
    allApps = data;
    renderChips();
    renderGrid();
  })
  .catch(() => {
    document.getElementById('appGrid').innerHTML =
      `<div class="empty-state"><h3>Couldn't load apps.json</h3><p>Make sure apps.json is in the same folder as this page.</p></div>`;
  });
</script>
</body>
</html>
